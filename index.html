<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GETS QR Code</title>


    <!-- =========================================
         BIBLIOTECA PARA LEITURA DE QR CODE
         ========================================= -->

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
    </script>


    <!-- =========================================
         BIBLIOTECA PARA GERAR QR CODE
         ========================================= -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 20px;

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            color: #222;
        }


        .container {

            max-width: 600px;

            margin: auto;

            background: white;

            padding: 25px;

            border-radius: 15px;

            box-shadow:
                0 3px 15px rgba(0,0,0,0.15);
        }


        h1 {

            text-align: center;

            margin-top: 0;

            margin-bottom: 25px;
        }


        .menu {

            display: flex;

            gap: 10px;

            margin-bottom: 25px;
        }


        .menu button {

            flex: 1;

            padding: 14px;

            font-size: 16px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            background: #ddd;
        }


        .menu button.ativo {

            background: #198754;

            color: white;
        }


        .tela {

            display: none;
        }


        .tela.ativa {

            display: block;
        }


        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 6px;

            font-weight: bold;
        }


        input {

            width: 100%;

            padding: 13px;

            font-size: 17px;

            border: 1px solid #ccc;

            border-radius: 7px;
        }


        button.acao {

            width: 100%;

            padding: 15px;

            margin-top: 18px;

            font-size: 18px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            background: #198754;

            color: white;
        }


        button.parar {

            background: #dc3545;
        }


        #reader {

            width: 100%;

            margin-top: 15px;
        }


        .resultado {

            margin-top: 20px;

            padding: 15px;

            border-radius: 8px;

            background: #f1f3f5;

            word-break: break-word;
        }


        .sucesso {

            color: #198754;

            font-weight: bold;
        }


        .erro {

            color: #dc3545;

            font-weight: bold;
        }


        #qrcode {

            display: flex;

            justify-content: center;

            margin-top: 25px;

            padding: 20px;

            background: white;
        }


        .texto-qr {

            margin-top: 15px;

            padding: 15px;

            background: #f1f3f5;

            border-radius: 8px;

            white-space: pre-line;
        }


        .pequeno {

            font-size: 14px;

            color: #666;

            margin-top: 8px;
        }

    </style>

</head>


<body>


<div class="container">


    <h1>GETS QR Code</h1>


    <!-- =====================================
         MENU
         ===================================== -->

    <div class="menu">

        <button
            id="btnLer"
            class="ativo"
            onclick="mostrarTela('ler')"
        >
            📷 Ler QR Code
        </button>


        <button
            id="btnGerar"
            onclick="mostrarTela('gerar')"
        >
            🏷️ Gerar QR Code
        </button>

    </div>



    <!-- =====================================
         TELA LER QR CODE
         ===================================== -->

    <div
        id="telaLer"
        class="tela ativa"
    >

        <h2>📷 Ler QR Code</h2>

        <p>
            Aponte a câmera para o QR Code do equipamento.
        </p>


        <div id="reader"></div>


        <button
            id="btnIniciar"
            class="acao"
            onclick="iniciarScanner()"
        >
            📷 INICIAR CÂMERA
        </button>


        <button
            id="btnParar"
            class="acao parar"
            onclick="pararScanner()"
            style="display:none;"
        >
            ⛔ PARAR CÂMERA
        </button>


        <div
            id="resultadoLeitura"
            class="resultado"
        >
            Aguardando leitura...
        </div>

    </div>



    <!-- =====================================
         TELA GERAR QR CODE
         ===================================== -->

    <div
        id="telaGerar"
        class="tela"
    >

        <h2>🏷️ Gerar QR Code</h2>


        <label for="gerarNS">
            Número de série
        </label>


        <input
            type="text"
            id="gerarNS"
            placeholder="Ex.: 107700"
        >


        <label for="gerarEquipamento">
            Equipamento
        </label>


        <input
            type="text"
            id="gerarEquipamento"
            placeholder="Ex.: MONITOR MULTIPARAMÉTRICO"
        >


        <button
            class="acao"
            onclick="gerarQRCode()"
        >
            🏷️ GERAR QR CODE
        </button>


        <div
            id="qrcode"
        ></div>


        <div
            id="textoQR"
            class="texto-qr"
            style="display:none;"
        ></div>


        <p class="pequeno">
            O QR Code será criado com duas linhas:
            NS e EQUIPAMENTO.
        </p>

    </div>


</div>



<!-- =========================================
     FIREBASE
     ========================================= -->

<script type="module">


    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
        getDatabase,
        ref,
        set
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";



    // =========================================
    // CONFIGURAÇÃO DO SEU FIREBASE
    // =========================================

     const firebaseConfig = {
      apiKey: "AIzaSyBr6xOmMgeRI5Q6FVB3puhgj-rZi5HN77U",
      authDomain: "app-gets-qrcode.firebaseapp.com",
      databaseURL: "https://app-gets-qrcode-default-rtdb.firebaseio.com",
      projectId: "app-gets-qrcode",
      storageBucket: "app-gets-qrcode.firebasestorage.app",
      messagingSenderId: "836525958120",
      appId: "1:836525958120:web:96b0db2bf81132cb6a7a5d"
    };


    // =========================================
    // INICIALIZA FIREBASE
    // =========================================

    const app =
        initializeApp(firebaseConfig);


    const database =
        getDatabase(app);



    // =========================================
    // ENVIA NÚMERO DE SÉRIE AO FIREBASE
    // =========================================

    window.enviarNumeroSerie =
        async function(numeroSerie) {


            const resultado =
                document.getElementById(
                    "resultadoLeitura"
                );


            resultado.innerHTML =
                "Enviando equipamento...";


            try {


                await set(

                    ref(
                        database,
                        "ordem"
                    ),

                    {

                        numero_serie:
                            numeroSerie,

                        status:
                            "novo",

                        timestamp:
                            Date.now()

                    }

                );


                resultado.innerHTML =

                    '<span class="sucesso">' +

                    '✓ Equipamento enviado com sucesso!' +

                    '</span>' +

                    '<br><br>' +

                    'Número de série: ' +

                    numeroSerie;


            }

            catch (erro) {


                console.error(erro);


                resultado.innerHTML =

                    '<span class="erro">' +

                    'Erro ao enviar para o Firebase.' +

                    '</span>';


            }

        };


</script>



<!-- =========================================
     JAVASCRIPT DO APLICATIVO
     ========================================= -->

<script>


    let scanner = null;

    let scannerAtivo = false;



    // =========================================
    // TROCAR TELA
    // =========================================

    function mostrarTela(tela) {


        const telaLer =
            document.getElementById(
                "telaLer"
            );


        const telaGerar =
            document.getElementById(
                "telaGerar"
            );


        const btnLer =
            document.getElementById(
                "btnLer"
            );


        const btnGerar =
            document.getElementById(
                "btnGerar"
            );


        if (tela === "ler") {


            telaLer.classList.add(
                "ativa"
            );


            telaGerar.classList.remove(
                "ativa"
            );


            btnLer.classList.add(
                "ativo"
            );


            btnGerar.classList.remove(
                "ativo"
            );


        }


        else {


            telaGerar.classList.add(
                "ativa"
            );


            telaLer.classList.remove(
                "ativa"
            );


            btnGerar.classList.add(
                "ativo"
            );


            btnLer.classList.remove(
                "ativo"
            );


            if (scannerAtivo) {

                pararScanner();

            }

        }

    }



    // =========================================
    // EXTRAIR NÚMERO DE SÉRIE
    // =========================================

    function extrairNumeroSerie(texto) {


        /*
         * Esperamos algo como:
         *
         * GETS
         * NS: 107700
         * EQUIPAMENTO: MONITOR...
         */


        const linhas =
            texto
            .split(/\r?\n/)
            .map(
                linha => linha.trim()
            );


        for (
            const linha of linhas
        ) {


            const resultado =
                linha.match(
                    /^NS\s*:\s*(.+)$/i
                );


            if (resultado) {


                return resultado[1]
                    .trim();

            }

        }


        /*
         * Se não encontrar "NS:",
         * tenta verificar se o QR Code
         * contém somente números.
         */


        const somenteNumero =
            texto
            .trim()
            .match(/^\d+$/);


        if (somenteNumero) {

            return somenteNumero[0];

        }


        return null;

    }



    // =========================================
    // QR CODE LIDO
    // =========================================

    function qrCodeLido(texto) {


        console.log(
            "QR Code:",
            texto
        );


        const numeroSerie =
            extrairNumeroSerie(
                texto
            );


        const resultado =
            document.getElementById(
                "resultadoLeitura"
            );


        if (!numeroSerie) {


            resultado.innerHTML =

                '<span class="erro">' +

                'Não foi possível identificar o número de série.' +

                '</span>' +

                '<br><br>' +

                'Conteúdo lido:' +

                '<br>' +

                texto;


            return;

        }


        resultado.innerHTML =

            "Número de série identificado: " +

            "<strong>" +

            numeroSerie +

            "</strong><br><br>" +

            "Enviando ao Firebase...";


        /*
         * Envia para o Firebase
         */

        window.enviarNumeroSerie(
            numeroSerie
        );


        /*
         * Para a câmera depois
         * de uma leitura válida.
         */

        pararScanner();

    }



    // =========================================
    // ERRO DE LEITURA
    // =========================================

    function erroScanner(
        erro
    ) {

        /*
         * Não mostramos todos os erros,
         * pois a câmera gera muitos avisos
         * enquanto procura o QR Code.
         */

        console.log(
            "Scanner:",
            erro
        );

    }



    // =========================================
    // INICIAR CÂMERA
    // =========================================

    function iniciarScanner() {


        if (scannerAtivo) {

            return;

        }


        scanner =
            new Html5Qrcode(
                "reader"
            );


        scanner.start(

            {
                facingMode: "environment"
            },

            {
                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                }

            },

            qrCodeLido,

            erroScanner

        )

        .then(

            function() {


                scannerAtivo = true;


                document
                    .getElementById(
                        "btnIniciar"
                    )
                    .style.display =
                    "none";


                document
                    .getElementById(
                        "btnParar"
                    )
                    .style.display =
                    "block";


                document
                    .getElementById(
                        "resultadoLeitura"
                    )
                    .innerText =
                    "Aponte a câmera para o QR Code...";


            }

        )

        .catch(

            function(erro) {


                console.error(
                    erro
                );


                document
                    .getElementById(
                        "resultadoLeitura"
                    )
                    .innerHTML =

                    '<span class="erro">' +

                    'Não foi possível acessar a câmera.' +

                    '</span>' +

                    '<br><br>' +

                    erro;


            }

        );

    }



    // =========================================
    // PARAR CÂMERA
    // =========================================

    function pararScanner() {


        if (
            scanner &&
            scannerAtivo
        ) {


            scanner
                .stop()

                .then(

                    function() {


                        scanner.clear();


                        scannerAtivo =
                            false;


                    }

                )

                .catch(

                    function(erro) {

                        console.error(
                            erro
                        );

                    }

                );

        }


        document
            .getElementById(
                "btnIniciar"
            )
            .style.display =
            "block";


        document
            .getElementById(
                "btnParar"
            )
            .style.display =
            "none";

    }



    // =========================================
    // GERAR QR CODE
    // =========================================

    function gerarQRCode() {


        const ns =
            document
            .getElementById(
                "gerarNS"
            )
            .value
            .trim();


        const equipamento =
            document
            .getElementById(
                "gerarEquipamento"
            )
            .value
            .trim();


        if (!ns) {


            alert(
                "Digite o número de série."
            );


            return;

        }


        if (!equipamento) {


            alert(
                "Digite o nome do equipamento."
            );


            return;

        }



        // =====================================
        // TEXTO DO QR CODE
        // =====================================

        const texto =

            "GETS\n" +

            "NS: " +
            ns +
            "\n" +

            "EQUIPAMENTO: " +
            equipamento;



        // =====================================
        // LIMPAR QR CODE ANTERIOR
        // =====================================

        const areaQR =
            document.getElementById(
                "qrcode"
            );


        areaQR.innerHTML =
            "";



        // =====================================
        // GERAR
        // =====================================

        new QRCode(

            areaQR,

            {

                text: texto,

                width: 250,

                height: 250,

                correctLevel:
                    QRCode.CorrectLevel.H

            }

        );



        // =====================================
        // MOSTRAR TEXTO
        // =====================================

        const textoQR =
            document.getElementById(
                "textoQR"
            );


        textoQR.style.display =
            "block";


        textoQR.innerText =
            texto;

    }


</script>


</body>

</html>
